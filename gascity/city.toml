[workspace]
provider = "claude"

[providers]
[providers.claude]
base = "builtin:claude"
ready_delay_ms = 0
[providers.claude.option_defaults]
effort = "high"
[providers.fable]
base = "builtin:claude"
args = ["--model", "fable"]
ready_delay_ms = 0
[providers.fable.option_defaults]
effort = "xhigh"
[providers.opus]
base = "builtin:claude"
args = ["--model", "opus"]
ready_delay_ms = 0
[providers.opus.option_defaults]
effort = "xhigh"
[providers.sonnet]
base = "builtin:claude"
args = ["--model", "sonnet"]
ready_delay_ms = 0
[providers.sonnet.option_defaults]
effort = "medium"

[defaults]
[defaults.rig]
[defaults.rig.imports]
[defaults.rig.imports.gc]
source = "https://github.com/gastownhall/gascity-packs/tree/main/gascity/roles"
version = "sha:3b3b89f2011e06d84459aa7bea1552382f13930a"

[[rigs]]
name = "mono"
prefix = "mono"
default_branch = "main"
[rigs.imports]
[rigs.imports.gc]
source = "https://github.com/gastownhall/gascity-packs/tree/main/gascity/roles"
version = "sha:3b3b89f2011e06d84459aa7bea1552382f13930a"

[[rigs]]
name = "mono-python"
prefix = "mopy"
default_branch = "main"
[rigs.imports]
[rigs.imports.gc]
source = "https://github.com/gastownhall/gascity-packs/tree/main/gascity/roles"
version = "sha:3b3b89f2011e06d84459aa7bea1552382f13930a"

[[rigs]]
name = "queenswood"
prefix = "qw"
default_branch = "main"
[rigs.imports]
[rigs.imports.gc]
source = "https://github.com/gastownhall/gascity-packs/tree/main/gascity/roles"
version = "sha:3b3b89f2011e06d84459aa7bea1552382f13930a"

